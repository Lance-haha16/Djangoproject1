{% extends "base.html" %}
{% load socialaccount static %}
{% block title %} 登录 {% endblock title %}
{% block content %}
<div class="container" style="padding-top: 32px; padding-bottom: 64px;">
    <div class="row">
        <div class="col-12 col-md-6" style="background: rgba(255,255,255,.82); border-radius: 16px; padding: 28px 24px;">
            <h4>登录</h4>
            <a class="btn btn-dark mt-3" href="{% provider_login_url 'github' process='login' %}">使用 GitHub 登录</a>

            <h5 class="mt-4">本地账号</h5>
            <p>还没有账号？点击<a href="{% url 'userprofile:register' %}">注册账号</a>加入我们吧！</p>
            <form method="post" action=".">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">账号</label>
                    <input type="text" class="form-control" id="username" name="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>
                <button type="submit" class="btn btn-primary">提交</button>
            </form>
            <p class="mt-3 mb-0">忘记密码了？点击<a href="{% url 'password_reset_recover' %}">这里</a>重置密码</p>
        </div>
    </div>
</div>
{% endblock content %}
